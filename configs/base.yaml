# Base configuration for Transformer Research Framework
vocab_size: 50257
hidden_dim: 256
num_layers: 4
num_heads: 8
num_kv_heads: 2
max_seq_len: 256
tie_word_embeddings: true
norm_type: "rmsnorm"
activation_type: "swiglu"
dropout: 0.0
precision: "fp32"

# Training hyperparameters
lr: 6.0e-4
min_lr: 6.0e-5
weight_decay: 0.01
warmup_steps: 500
batch_size: 16
gradient_accumulation_steps: 4
epochs: 3
val_interval: 500
val_max_samples: 2000
max_samples: 150000
clip_grad: 1.0

# Dataset and Tokenizer
dataset_name: "roneneldan/TinyStories"
dataset_config: null
tokenizer_name: "gpt2"
use_custom_optimizer: false
seed: 42
early_stopping_patience: 3

# Future-proof Ablations
rope: true
qk_norm: true
gqa: true
